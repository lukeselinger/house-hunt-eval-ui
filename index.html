<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>House Hunt — Evaluate</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf9f7; --card: #ffffff; --ink: #1a1a1a; --muted: #6b6b6b;
    --line: rgba(0, 0, 0, 0.08);        /* separation borders: alpha in light */
    --accent: #2f6f4f; --accent-ink: #ffffff;
    --chip: #f0eee9; --warn: #a04b12; --listed: #b3261e;
    --elev: 0 0 0 1px rgb(0 0 0 / 0.05), 0 1px 3px rgb(0 0 0 / 0.05),
            0 4px 10px -4px rgb(0 0 0 / 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --card: #202225; --ink: #ececec; --muted: #9a9a9a;
      --line: #34363a;                  /* separation borders: solid in dark */
      --accent: #4d9a74; --accent-ink: #0e1411;
      --chip: #2b2d31; --warn: #d98a4f; --listed: #e57373;
      --elev: 0 0 0 1px rgb(255 255 255 / 0.09);   /* shadows -> white ring */
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         -webkit-font-smoothing: antialiased;
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button, a, input, select, textarea { touch-action: manipulation; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  header { padding: 14px 16px 12px; border-bottom: 1px solid var(--line);
           position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header h1 { margin: 0 0 8px; font-size: 17px; text-wrap: balance; }
  .hdr-row { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap;
             margin-top: 8px; }
  .hdr-row:first-of-type { margin-top: 0; }
  .hdr-row input[type=search] { flex: 1; min-width: 140px; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    color: var(--ink); font-size: 16px; min-height: 44px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px;
         overflow: hidden; }
  .seg button { border: 0; background: var(--card); color: var(--ink);
    padding: 0 14px; min-height: 42px; font-size: 14px;
    transition: background-color 150ms ease-out, color 150ms ease-out; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: var(--accent-ink);
                   font-weight: 600; }
  select.ctl, button.ctl, input.ctl { border: 1px solid var(--line);
    border-radius: 8px; background: var(--card); color: var(--ink);
    font-size: 16px; min-height: 44px; padding: 0 10px; }
  button.ctl { transition: background-color 150ms ease-out,
               transform 150ms ease-out; }
  .yr { display: flex; align-items: center; gap: 5px; color: var(--muted);
        font-size: 13px; }
  .yr input { width: 64px; text-align: center;
              font-variant-numeric: tabular-nums; }
  main { max-width: 720px; margin: 0 auto; padding: 10px 12px 60px; }
  h2 { font-size: 15px; margin: 18px 4px 8px; color: var(--muted);
       font-weight: 600; font-variant-numeric: tabular-nums; }
  .note { color: var(--muted); font-size: 13px; margin: 8px 4px; }
  .card { background: var(--card); border-radius: 10px; box-shadow: var(--elev);
          padding: 12px 14px; margin-bottom: 10px; }
  .addr { font-weight: 650; font-size: 15px; }
  .meta, .price { color: var(--muted); font-size: 13px; margin-top: 2px;
                  font-variant-numeric: tabular-nums; }
  .price b { color: var(--ink); font-size: 14px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px;
         border-radius: 10px; background: var(--chip); color: var(--muted);
         letter-spacing: 0.03em; vertical-align: 1px; }
  .tag.in { color: var(--accent); font-weight: 600; }
  .tag.listed { color: var(--listed); font-weight: 700; }
  .tag.done { color: var(--accent); }
  .row2 { display: flex; justify-content: space-between; align-items: center;
          margin-top: 8px; gap: 8px; }
  .links { display: flex; }
  .links a { color: var(--accent); text-decoration: none; font-size: 14px;
             display: inline-flex; align-items: center; min-height: 44px;
             padding: 0 10px; margin: -10px 0; }
  .links a:first-child { margin-left: -10px; }
  .evalbtn { border: 0; background: var(--chip); color: var(--ink);
             border-radius: 8px; padding: 0 16px; min-height: 40px;
             font-size: 13px; box-shadow: 0 0 0 1px var(--line);
             transition: background-color 150ms ease-out, transform 150ms ease-out; }
  form { border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 12px; }
  .grp { margin-bottom: 12px; }
  .grp .lbl { display: block; font-size: 12px; color: var(--muted);
              margin-bottom: 6px; text-transform: uppercase;
              letter-spacing: 0.06em; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opts button { border: 1px solid var(--line); background: var(--card);
    color: var(--ink); border-radius: 8px; padding: 0 12px; min-height: 40px;
    font-size: 13px; position: relative;
    transition: background-color 150ms ease-out, border-color 150ms ease-out,
                color 150ms ease-out, transform 150ms ease-out; }
  .opts button.on { background: var(--accent); color: var(--accent-ink);
                    border-color: var(--accent); font-weight: 600; }
  .opts button .ord { position: absolute; top: -6px; right: -5px;
    background: var(--warn); color: #fff; border-radius: 8px; font-size: 11px;
    padding: 0 4px; font-variant-numeric: tabular-nums; pointer-events: none; }
  textarea { width: 100%; min-height: 72px; padding: 10px 12px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
    color: var(--ink); font: inherit; font-size: 16px; line-height: 1.4; }
  .save { background: var(--accent); color: var(--accent-ink); border: 0;
          border-radius: 8px; padding: 0 20px; min-height: 44px;
          font-size: 14px; font-weight: 600;
          transition: background-color 150ms ease-out, transform 150ms ease-out; }
  .save:disabled { cursor: default; }
  .err { color: var(--listed); font-size: 13px; margin-top: 8px;
         white-space: pre-wrap; }
  .setup { max-width: 460px; margin: 60px auto; padding: 0 16px; }
  .setup input { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--card); color: var(--ink);
    margin: 10px 0; font-size: 16px; min-height: 44px; }
  @media (hover: hover) and (pointer: fine) {
    .seg button:not(.on):hover, .evalbtn:hover, button.ctl:hover,
    .opts button:not(.on):hover { background: var(--chip); }
    .opts button:not(.on):hover { background: color-mix(in oklch, var(--card) 92%, var(--ink)); }
    .save:not(:disabled):hover,
    .opts button.on:hover, .seg button.on:hover {
      background: color-mix(in oklch, var(--accent) 88%, black); }
    .links a:hover { text-decoration: underline; }
  }
  button:not(:disabled):active { transform: scale(0.96); }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    button:active { transform: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// ---- config (placeholders substituted by app/deploy.py at upload time) ----
const SUPABASE_URL = "https://ivqotvufsdiultnhbdxc.supabase.co";
const BAKED_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2cW90dnVmc2RpdWx0bmhiZHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MDkyODksImV4cCI6MjA5NjQ4NTI4OX0.kgYnKuk6IekYJY66sLyddFk2IddWzBeR5W5VccxbZgM";           // anon (publishable) key ONLY — never the service key
const CEILING = Number("1300000") || 1300000;
const TENURE_YEARS = 15;
const TOWNS = ["Wenham", "Hamilton"];
const ZIPS = { Wenham: "01984", Hamilton: "01982" };
const DEMO = new URLSearchParams(location.search).get("demo") === "1";

const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plural = n => n === 1 ? "" : "s";

function anonKey() {
  if (!BAKED_KEY.startsWith("__")) return BAKED_KEY;
  return localStorage.getItem("hh_anon_key") || null;
}

async function api(path, params, opts = {}) {
  const qs = new URLSearchParams(params).toString();
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}${qs ? "?" + qs : ""}`, {
    method: opts.method || "GET",
    headers: Object.assign({
      apikey: anonKey(), Authorization: `Bearer ${anonKey()}`,
      "Content-Type": "application/json",
    }, opts.headers || {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return opts.raw ? r : r.json();
}

// ---- link construction (mirrors pipeline/watchlist_export.py links_md) ----
function displayAddr(addr) {
  const words = { AV: "Ave", WM: "William" };
  return addr.split(" ").map(w =>
    words[w] || w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(" ");
}
function links(addr, town) {
  const da = displayAddr(addr);
  const full = `${da}, ${town}, MA ${ZIPS[town]}`;
  const z = `https://www.zillow.com/homes/${encodeURIComponent(full.replace(/ /g, "-"))}_rb/`;
  const q = encodeURIComponent(full);
  return { z,
    r: `https://www.google.com/search?q=redfin+${q}`,
    m: `https://www.google.com/maps/place/${q}` };
}

// ---- local record of what's been saved from this browser (UI hint only;
//      the DB is the source of truth — anon has no read access to evaluations) ----
const done = JSON.parse(localStorage.getItem("hh_done") || "{}");
function markDone(pid, verdict, who) {
  (done[pid] = done[pid] || []).push({ verdict, who, at: new Date().toISOString() });
  localStorage.setItem("hh_done", JSON.stringify(done));
}

let who = localStorage.getItem("hh_who") || "";

// ---- list view state: town filter, sort, year-built range, address query ----
const view = { town: "All", sort: "est", dir: "asc", yrMin: null, yrMax: null, q: "" };
const SORT_KEYS = {
  est:      p => p.price_estimate,
  assessed: p => p.assessed_value,
  year:     p => p.year_built,
  sqft:     p => p.sqft,
  lot:      p => Number(p.lot_size),
};

// ---- watchlist query (mirrors pipeline/watchlist_export.py predicate) ----
async function loadWatchlist() {
  const cutoff = new Date(Date.now() - TENURE_YEARS * 365.25 * 864e5)
    .toISOString().slice(0, 10);
  const [soldRows, rRows] = await Promise.all([
    api("listing_events", { event: "eq.sold", select: "property_id" }),
    api("town_price_ratios", { town: `in.(${TOWNS.join(",")})`,
      select: "town,r_median,r_p75,n,computed_at", order: "computed_at.desc" }),
  ]);
  const sold = new Set(soldRows.map(r => r.property_id));
  const R = {};
  for (const r of rRows) if (!R[r.town]) R[r.town] = r;   // first seen = latest
  const out = {};
  for (const town of TOWNS) {
    const rows = await api("properties", {
      town: `eq.${town}`, building_style: "ilike.*COLONIAL*", sqft: "gte.1800",
      last_sale_price: "gt.100000", last_sale_date: `lt.${cutoff}`,
      price_estimate: `lte.${CEILING}`,
      select: "id,address,year_built,building_style,sqft,lot_size,assessed_value," +
              "price_estimate,last_sale_date,last_sale_price,on_market",
      order: "price_estimate.asc",
    });
    out[town] = { r: R[town], homes: rows.filter(p => !sold.has(p.id)) };
  }
  return out;
}

// ---- rendering ----
function homeCard(p, town, inCut) {
  const tier = p.assessed_value <= inCut ? "in" : "watch";
  const saleYr = (p.last_sale_date || "").slice(0, 4);
  const tenure = saleYr ? new Date().getFullYear() - +saleYr : "?";
  const lot = p.lot_size ? (p.lot_size / 43560).toFixed(2) + " ac" : "?";
  const status = p.on_market ? '<span class="tag listed">LISTED</span>'
               : p.on_market === false ? '<span class="tag">off-mkt?</span>' : "";
  const l = links(p.address, town);
  const rec = (done[p.id] || []).map(d =>
    `<span class="tag done">✓ ${esc(VERDICT_LABELS[d.verdict] || d.verdict)} — ${esc(d.who)}</span>`).join(" ");
  return `<div class="card" data-addr="${esc(p.address.toLowerCase())}" data-pid="${p.id}">
    <div class="addr">${esc(p.address)} ${status} ${rec}</div>
    <div class="meta">${p.year_built || "?"} · ${esc(p.building_style)} ·
      ${p.sqft.toLocaleString()} sqft · ${lot} · last sale ${saleYr}
      $${(p.last_sale_price || 0).toLocaleString()} (${tenure}y)</div>
    <div class="price">$${p.assessed_value.toLocaleString()} assessed →
      <b>$${p.price_estimate.toLocaleString()}</b> est
      <span class="tag ${tier}">${tier}</span></div>
    <div class="row2">
      <span class="links"><a href="${l.z}" target="_blank" rel="noopener">Zillow</a>
        <a href="${l.r}" target="_blank" rel="noopener">Redfin</a>
        <a href="${l.m}" target="_blank" rel="noopener">Map</a></span>
      <button class="evalbtn" onclick="toggleForm(${p.id}, this)">Evaluate</button>
    </div>
    <div class="formslot"></div>
  </div>`;
}

const VERDICTS = ["would-offer-now", "would-consider", "pass-on-house", "pass-on-location-only"];
const VERDICT_LABELS = {
  "would-offer-now": "Would offer now",
  "would-consider": "Would consider",
  "pass-on-house": "Pass on house",
  "pass-on-location-only": "Pass on location only",
};
const AXES = ["house", "location", "price", "condition", "none"];
const formState = {};   // pid -> {verdict, axes: []}

window.toggleForm = (pid, btn) => {
  const slot = btn.closest(".card").querySelector(".formslot");
  if (slot.innerHTML) { slot.innerHTML = ""; return; }
  formState[pid] = { verdict: null, axes: [] };
  slot.innerHTML = `<form onsubmit="return saveEval(event, ${pid})">
    <div class="grp"><span class="lbl" id="vlbl-${pid}">Verdict</span>
      <div class="opts" role="group" aria-labelledby="vlbl-${pid}">
      ${VERDICTS.map(v => `<button type="button" onclick="pickVerdict(${pid}, '${v}', this)">${VERDICT_LABELS[v]}</button>`).join("")}
    </div></div>
    <div class="grp"><span class="lbl" id="albl-${pid}">Failure axes — tap in order, primary first</span>
      <div class="opts" role="group" aria-labelledby="albl-${pid}">
      ${AXES.map(a => `<button type="button" data-axis="${a}" onclick="pickAxis(${pid}, '${a}', this)">${a.charAt(0).toUpperCase() + a.slice(1)}</button>`).join("")}
    </div></div>
    <div class="grp"><label class="lbl" for="vr-${pid}">Reasoning — your actual words</label>
      <textarea id="vr-${pid}" required onkeydown="textareaSubmit(event)"
        placeholder="Why? Verbatim — this is the asset."></textarea></div>
    <button class="save" type="submit">Save as ${esc(who)}</button>
    <div class="err" role="alert"></div>
  </form>`;
  if (!("ontouchstart" in window)) slot.querySelector("textarea").focus();
};

window.textareaSubmit = e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter")
    e.target.closest("form").requestSubmit();
};

window.pickVerdict = (pid, v, btn) => {
  formState[pid].verdict = v;
  for (const b of btn.parentNode.children) b.classList.toggle("on", b === btn);
};

window.pickAxis = (pid, a, btn) => {
  const axes = formState[pid].axes;
  const i = axes.indexOf(a);
  i >= 0 ? axes.splice(i, 1) : axes.push(a);
  for (const b of btn.parentNode.children) {
    const j = axes.indexOf(b.dataset.axis);
    b.classList.toggle("on", j >= 0);
    b.querySelector(".ord")?.remove();
    if (j >= 0 && axes.length > 1)
      b.insertAdjacentHTML("beforeend", `<span class="ord">${j + 1}</span>`);
  }
};

window.saveEval = (ev, pid) => {
  ev.preventDefault();
  const form = ev.target, st = formState[pid];
  const err = form.querySelector(".err");
  const save = form.querySelector(".save");
  const text = form.querySelector("textarea").value.trim();
  if (!st.verdict) { err.textContent = "Pick a verdict first."; return false; }
  if (!text) { err.textContent = "Reasoning is required — it's the asset."; return false; }
  if (DEMO) { err.textContent = "Demo mode — nothing is saved."; return false; }
  save.disabled = true;
  save.textContent = "Saving…";
  api("evaluations", {}, {
    method: "POST", raw: true,
    headers: { Prefer: "return=minimal" },
    body: { property_id: pid, verdict: st.verdict,
            failure_axis: st.axes.length ? st.axes : null,
            nominated_by: who, verbatim_reasoning: text },
  }).then(() => {
    markDone(pid, st.verdict, who);
    renderList();
  }).catch(e => {
    err.textContent = "Save failed: " + e.message;
    save.disabled = false;
    save.textContent = `Save as ${who}`;
  });
  return false;
};

window.setWho = w => {
  who = w;
  localStorage.setItem("hh_who", w);
  for (const b of document.querySelectorAll("#whoseg button"))
    b.classList.toggle("on", b.textContent === w);
  renderList();   // open forms reset; Save button label must match `who`
};

window.setTown = t => {
  view.town = t;
  for (const b of document.querySelectorAll("#townseg button"))
    b.classList.toggle("on", b.dataset.town === t);
  renderList();
};

window.setSort = s => { view.sort = s; renderList(); };
window.flipDir = btn => {
  view.dir = view.dir === "asc" ? "desc" : "asc";
  btn.textContent = view.dir === "asc" ? "↑" : "↓";
  btn.setAttribute("aria-label", `Sort ${view.dir === "asc" ? "ascending" : "descending"}`);
  renderList();
};

let yrTimer;
window.setYears = () => {
  clearTimeout(yrTimer);
  yrTimer = setTimeout(() => {
    const val = id => {
      const v = document.getElementById(id).value.trim();
      return /^\d{4}$/.test(v) ? +v : null;   // apply only complete years
    };
    view.yrMin = val("yrmin");
    view.yrMax = val("yrmax");
    renderList();
  }, 300);
};

window.filterCards = q => { view.q = q.trim().toLowerCase(); applyAddrFilter(); };

function applyAddrFilter() {
  let shown = 0;
  for (const c of document.querySelectorAll(".card")) {
    const hit = !view.q || c.dataset.addr.includes(view.q);
    c.style.display = hit ? "" : "none";
    if (hit) shown++;
  }
  const none = document.getElementById("nomatch");
  if (none) none.hidden = shown > 0 || !document.querySelector(".card");
}

function visibleHomes(homes) {
  let rows = homes;
  if (view.yrMin !== null || view.yrMax !== null)
    rows = rows.filter(p => p.year_built &&
      (view.yrMin === null || p.year_built >= view.yrMin) &&
      (view.yrMax === null || p.year_built <= view.yrMax));
  const key = SORT_KEYS[view.sort];
  const sgn = view.dir === "asc" ? 1 : -1;
  return [...rows].sort((a, b) => {
    const ka = key(a), kb = key(b);
    if (ka == null && kb == null) return 0;
    if (ka == null) return 1;                 // nulls last either direction
    if (kb == null) return -1;
    return (ka - kb) * sgn;
  });
}

let data = null;

function renderShell() {
  $app.innerHTML = `<header><h1>House Hunt — long-tenure watchlist</h1>
    <div class="hdr-row">
      <span class="seg" id="whoseg" role="group" aria-label="Recording as">
        ${["Luke", "Michelle"].map(w =>
          `<button class="${who === w ? "on" : ""}" onclick="setWho('${w}')">${w}</button>`).join("")}
      </span>
      <input type="search" placeholder="Filter by address…" aria-label="Filter by address"
        autocomplete="off" spellcheck="false" oninput="filterCards(this.value)">
    </div>
    <div class="hdr-row">
      <span class="seg" id="townseg" role="group" aria-label="Town">
        ${["All", ...TOWNS].map(t =>
          `<button data-town="${t}" class="${view.town === t ? "on" : ""}"
             onclick="setTown('${t}')">${t}</button>`).join("")}
      </span>
      <select class="ctl" aria-label="Sort by" onchange="setSort(this.value)">
        <option value="est">Price est.</option>
        <option value="assessed">Assessed</option>
        <option value="year">Year built</option>
        <option value="sqft">Sqft</option>
        <option value="lot">Lot size</option>
      </select>
      <button class="ctl" aria-label="Sort ascending" onclick="flipDir(this)">↑</button>
      <span class="yr"><label for="yrmin">Built</label>
        <input class="ctl" id="yrmin" inputmode="numeric" maxlength="4"
          placeholder="min" aria-label="Built after year" oninput="setYears()">
        –
        <input class="ctl" id="yrmax" inputmode="numeric" maxlength="4"
          placeholder="max" aria-label="Built before year" oninput="setYears()">
      </span>
    </div></header><main id="list"></main>`;
  renderList();
}

function renderList() {
  if (!data) return;
  let total = 0;
  let html = "";
  if (DEMO) html += `<p class="note">Demo data — saving is disabled.</p>`;
  if (!who) html += `<p class="note">Pick who you are (top left) before evaluating.</p>`;
  for (const town of TOWNS) {
    if (view.town !== "All" && view.town !== town) continue;
    const { r, homes } = data[town];
    const inCut = CEILING / Number(r.r_p75);
    const rows = visibleHomes(homes);
    total += rows.length;
    html += `<h2>${town} — ${rows.length} home${plural(rows.length)} (R ${r.r_median}, n=${r.n}, ${r.computed_at.slice(0, 10)})</h2>`;
    html += rows.map(p => homeCard(p, town, inCut)).join("");
  }
  if (total === 0) html += `<p class="note">No homes match these filters.</p>`;
  html += `<p class="note" id="nomatch" hidden>No homes match this filter.</p>`;
  html += `<p class="note">${total} home${plural(total)} shown · ceiling $${CEILING.toLocaleString()} ·
    estimates = assessed × R · links open Zillow / Redfin-search / Street View.
    Saved verdicts land in the evaluations table; the ✓ tags are this browser's
    memory of its own saves.</p>`;
  document.getElementById("list").innerHTML = html;
  applyAddrFilter();
}

function renderSetup() {
  $app.innerHTML = `<div class="setup"><h1>Setup</h1>
    <p>Paste the Supabase <b>anon (publishable)</b> key — found in the dashboard
    under Settings → API. Never the service-role key.</p>
    <label class="lbl" for="k">Anon key</label>
    <input id="k" placeholder="eyJ…" autocomplete="off" spellcheck="false">
    <button class="save" onclick="localStorage.setItem('hh_anon_key',
      document.getElementById('k').value.trim()); location.reload()">Save</button></div>`;
}

async function main() {
  if (DEMO) {
    data = demoData();
    renderShell();
    return;
  }
  if (!anonKey()) { renderSetup(); return; }
  $app.innerHTML = `<p class="note" style="margin:40px 16px">Loading watchlist…</p>`;
  try {
    data = await loadWatchlist();
    renderShell();
  } catch (e) {
    $app.innerHTML = `<div class="setup"><p class="err">Load failed: ${esc(e.message)}</p>
      <button class="save" onclick="localStorage.removeItem('hh_anon_key');
        location.reload()">Re-enter key</button></div>`;
  }
}

  return {
    Wenham: { r: { r_median: "1.1749", r_p75: "1.2523", n: 31, computed_at: "2026-08-06T00:00:00" },

    Hamilton: { r: { r_median: "1.203", r_p75: "1.2523", n: 74, computed_at: "2026-08-06T00:00:00" },
      homes: [mk(3, "21 UNTITLED ST", 1955, 2100, 15000, 700000, 842100, "2004-03-01", 300000, false)] },
  };
}
