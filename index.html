<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>House Hunt — Evaluate</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf9f7; --card: #ffffff; --ink: #1a1a1a; --muted: #6b6b6b;
    --line: rgba(0, 0, 0, 0.08);        /* separation borders: alpha in light */
    --accent: #2f6f4f; --accent-ink: #ffffff;
    --chip: #f0eee9;
    --warn: #a04b12; --warn-ink: #ffffff;
    --listed: #b3261e; --listed-ink: #ffffff;
    --elev: 0 0 0 1px rgb(0 0 0 / 0.05), 0 1px 3px rgb(0 0 0 / 0.05),
            0 4px 10px -4px rgb(0 0 0 / 0.05);
  }
  /* theme: data-theme on <html> overrides the system preference (set before
     first paint from localStorage). The two dark blocks below must stay
     IDENTICAL — one serves system-dark, one serves the manual toggle. */
  :root[data-theme="light"] { color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a; --card: #202225; --ink: #ececec; --muted: #9a9a9a;
      --line: #34363a;                  /* separation borders: solid in dark */
      --accent: #4d9a74; --accent-ink: #0e1411;
      --chip: #2b2d31;
      --warn: #d98a4f; --warn-ink: #1c1206;      /* dark ink on light state colors */
      --listed: #e57373; --listed-ink: #1c1012;
      --elev: 0 0 0 1px rgb(255 255 255 / 0.09);   /* shadows -> white ring */
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17181a; --card: #202225; --ink: #ececec; --muted: #9a9a9a;
    --line: #34363a;
    --accent: #4d9a74; --accent-ink: #0e1411;
    --chip: #2b2d31;
    --warn: #d98a4f; --warn-ink: #1c1206;
    --listed: #e57373; --listed-ink: #1c1012;
    --elev: 0 0 0 1px rgb(255 255 255 / 0.09);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         -webkit-font-smoothing: antialiased;
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button, a, input, select, textarea { touch-action: manipulation; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line);
           position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .hdr-row { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap;
             margin-top: 8px; }
  .hdr-row:first-child { margin-top: 0; }
  /* row 1 = identity + view: content-sized, never wraps, never separates */
  .hdr-row.primary { justify-content: space-between; flex-wrap: nowrap; }
  /* street filter is a nice-to-have: it takes leftover row space, capped —
     never a whole row of its own */
  .hdr-row input[type=search] { flex: 1 1 110px; min-width: 110px;
    max-width: 190px; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    color: var(--ink); min-height: 44px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px;
         overflow: hidden; }
  .seg button { border: 0; background: var(--card); color: var(--ink);
    padding: 0 14px; min-height: 42px; font-size: 14px;
    transition: background-color 150ms ease-out, color 150ms ease-out; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .hdr-right { display: flex; align-items: center; gap: 4px; flex: none; }
  /* ghost icon button — nice-to-have weight, full 44px hit area */
  .iconbtn { border: 0; background: none; color: var(--muted);
    min-width: 44px; min-height: 44px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: color 150ms ease-out, background-color 150ms ease-out,
                transform 150ms ease-out; }
  /* active-profile chip: shows who's recording; switching is behind an
     action sheet — a deliberate act, not a view toggle */
  .who-chip { display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); border-radius: 22px; background: var(--card);
    color: var(--ink); padding: 0 14px 0 6px; min-height: 44px; font-size: 14px;
    transition: background-color 150ms ease-out, transform 150ms ease-out; }
  .ava { width: 30px; height: 30px; border-radius: 50%; background: var(--accent);
    color: var(--accent-ink); display: inline-flex; align-items: center;
    justify-content: center; font-size: 14px; flex: none; }
  .sheet-backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / 0.35);
    z-index: 100; animation: fadeIn 150ms ease-out; }
  .sheet { position: fixed; left: 50%; bottom: 16px;
    transform: translateX(-50%); width: min(420px, calc(100% - 24px));
    background: var(--card); border-radius: 14px; padding: 8px;
    box-shadow: var(--elev), 0 12px 40px -12px rgb(0 0 0 / 0.45); z-index: 101;
    animation: sheetIn 180ms ease-out; }
  .sheet .item { display: flex; width: 100%; align-items: center; gap: 10px;
    padding: 0 12px; min-height: 52px; border: 0; background: none;
    color: var(--ink); border-radius: 8px; font-size: 15px; text-align: left;
    transition: background-color 150ms ease-out; }
  .sheet .item .check { margin-left: auto; color: var(--accent); }
  .sheet .item.cancel { color: var(--muted); justify-content: center; }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes sheetIn { from { opacity: 0; transform: translate(-50%, 10px); } }
  select.ctl, button.ctl, input.ctl { border: 1px solid var(--line);
    border-radius: 8px; background: var(--card); color: var(--ink);
    min-height: 44px; padding: 0 12px; }
  button.ctl { transition: background-color 150ms ease-out,
               transform 150ms ease-out; }
  /* one control type size: 14px. Exception: on touch devices, FIELDS
     (inputs/selects) go 16px — under that, iOS Safari zooms on focus. */
  header button, header input, header select { font-size: 14px; }
  @media (pointer: coarse) {
    header input, header select { font-size: 16px; }
  }
  /* selects draw their own chevron so both edges share the same padding */
  .selwrap { position: relative; display: inline-flex; }
  .selwrap::after { content: "▾"; position: absolute; right: 12px; top: 50%;
    transform: translateY(-50%); pointer-events: none; color: var(--muted);
    font-size: 11px; }
  select.ctl { appearance: none; -webkit-appearance: none;
               padding: 0 28px 0 12px; }
  /* sort attribute + direction read as one control */
  .sortgrp { display: inline-flex; border: 1px solid var(--line);
             border-radius: 8px; overflow: hidden; background: var(--card); }
  .sortgrp .ctl { border: 0; border-radius: 0; min-height: 42px; }
  .sortgrp .dir { border-left: 1px solid var(--line); min-width: 44px;
                  text-align: center; }
  .ctl-lbl { display: flex; align-items: center; gap: 6px;
             color: var(--muted); font-size: 13px; }
  .yr input { width: 60px; text-align: center; padding: 0 6px;
              font-variant-numeric: tabular-nums; }
  main { max-width: 720px; margin: 0 auto; padding: 10px 12px 60px; }
  h2 { font-size: 15px; margin: 18px 4px 8px; color: var(--muted);
       font-weight: 600; font-variant-numeric: tabular-nums; }
  h2 .prov { font-size: 12px; font-weight: 400; }
  .note { color: var(--muted); font-size: 13px; margin: 8px 4px; }
  .card { background: var(--card); border-radius: 10px; box-shadow: var(--elev);
          padding: 12px 14px; margin-bottom: 10px; }
  .addr { font-weight: 650; font-size: 15px; }
  .qual { color: var(--muted); font-size: 13px; margin-top: 1px; }
  /* the decision figure leads; context is fine print below the stat grid */
  .pricerow { display: flex; align-items: baseline; gap: 8px; margin-top: 8px;
              color: var(--muted); font-size: 13px;
              font-variant-numeric: tabular-nums; }
  .pricerow .amt { font-size: 17px; font-weight: 650; color: var(--ink);
                   letter-spacing: -0.01em; }
  /* comparable attributes in fixed columns — same template every card, so
     one column scans vertically across cards */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 12px;
           margin: 10px 0 0; max-width: 420px; }
  .stats div { min-width: 0; }
  .stats dt { font-size: 12px; text-transform: uppercase;
              letter-spacing: 0.05em; color: var(--muted); }
  .stats dd { margin: 0; font-size: 15px; font-variant-numeric: tabular-nums;
              white-space: nowrap; }
  .fine { color: var(--muted); font-size: 12px; margin-top: 8px;
          font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 7px;
         border-radius: 10px; background: var(--chip); color: var(--muted);
         letter-spacing: 0.03em; vertical-align: 1px; }
  .tag.in { color: var(--accent); font-weight: 600; }
  .tag.listed { color: var(--listed); font-weight: 700; }
  .tag.done { color: var(--accent); }
  .tag.road { color: var(--warn); font-weight: 600; }
  .row2 { display: flex; justify-content: space-between; align-items: center;
          margin-top: 8px; gap: 8px; }
  .links { display: flex; }
  .links a { color: var(--accent); text-decoration: none; font-size: 14px;
             display: inline-flex; align-items: center; min-height: 44px;
             padding: 0 10px; margin: -10px 0; }
  .links a:first-child { margin-left: -10px; }
  .evalbtn { border: 0; background: var(--chip); color: var(--ink);
             border-radius: 8px; padding: 0 16px; min-height: 44px;
             font-size: 13px; box-shadow: 0 0 0 1px var(--line);
             transition: background-color 150ms ease-out, transform 150ms ease-out; }
  .donetoggle { border: 0; background: none; color: var(--muted);
    font-size: 13px; padding: 8px 4px; min-height: 44px;
    transition: color 150ms ease-out; }
  form { border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 12px; }
  .grp { margin-bottom: 12px; }
  .grp .lbl { display: block; font-size: 12px; color: var(--muted);
              margin-bottom: 6px; text-transform: uppercase;
              letter-spacing: 0.06em; }
  .grp .hint { display: block; font-size: 12px; color: var(--muted);
               margin: -4px 0 6px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opts button { border: 1px solid var(--line); background: var(--card);
    color: var(--ink); border-radius: 8px; padding: 0 12px; min-height: 44px;
    font-size: 13px; position: relative;
    transition: background-color 150ms ease-out, border-color 150ms ease-out,
                color 150ms ease-out, transform 150ms ease-out; }
  /* state signaled by bg+ink only — a weight change would reflow the row */
  .opts button.on { background: var(--accent); color: var(--accent-ink);
                    border-color: var(--accent); }
  .opts button.fail { background: var(--listed); color: var(--listed-ink);
                      border-color: var(--listed); }
  .opts button .ord { position: absolute; top: -6px; right: -5px;
    background: var(--warn); color: var(--warn-ink); border-radius: 8px;
    font-size: 11px; padding: 0 4px; font-variant-numeric: tabular-nums;
    pointer-events: none; }
  .glyph { display: inline-block; width: 15px; text-align: right; }
  textarea { width: 100%; min-height: 72px; padding: 10px 12px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
    color: var(--ink); font: inherit; font-size: 16px; line-height: 1.4; }
  .save { background: var(--accent); color: var(--accent-ink); border: 0;
          border-radius: 8px; padding: 0 20px; min-height: 44px;
          font-size: 14px; font-weight: 600;
          transition: background-color 150ms ease-out, transform 150ms ease-out; }
  .save:disabled { cursor: default; }
  .err { color: var(--listed); font-size: 13px; margin-top: 8px;
         white-space: pre-wrap; }
  .setup { max-width: 460px; margin: 60px auto; padding: 0 16px; }
  .setup input { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--card); color: var(--ink);
    margin: 10px 0; font-size: 16px; min-height: 44px; }
  .gate { max-width: 420px; margin: 18vh auto 0; padding: 0 16px;
          text-align: center; }
  .gate h1 { font-size: 22px; margin-bottom: 24px; }
  .gate button { display: block; width: 100%; margin: 12px 0; min-height: 64px;
    font-size: 18px; font-weight: 600; border: 0; border-radius: 12px;
    background: var(--card); color: var(--ink); box-shadow: var(--elev);
    transition: background-color 150ms ease-out, transform 150ms ease-out; }
  @media (hover: hover) and (pointer: fine) {
    .seg button:not(.on):hover, .evalbtn:hover, button.ctl:hover,
    .gate button:hover, .who-chip:hover, .sheet .item:hover { background: var(--chip); }
    .iconbtn:hover { background: var(--chip); color: var(--ink); }
    .opts button:not(.on):not(.fail):hover {
      background: color-mix(in oklch, var(--card) 92%, var(--ink)); }
    .save:not(:disabled):hover,
    .opts button.on:hover, .seg button.on:hover {
      background: color-mix(in oklch, var(--accent) 88%, black); }
    .links a:hover { text-decoration: underline; }
    .donetoggle:hover { color: var(--ink); }
  }
  /* phones: the merged filter row wraps to several lines — a sticky header
     that tall would eat the viewport; let it scroll away */
  @media (max-width: 540px) {
    header { position: static; }
  }
  /* very narrow: chip collapses to the avatar; row 1 still never wraps */
  @media (max-width: 430px) {
    .who-chip .name { display: none; }
    .who-chip { padding: 0 6px; }
  }
  button:not(:disabled):active { transform: scale(0.96); }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    button:active { transform: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// ---- config (placeholders substituted by app/deploy.py at upload time) ----
const SUPABASE_URL = "https://ivqotvufsdiultnhbdxc.supabase.co";
const BAKED_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2cW90dnVmc2RpdWx0bmhiZHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MDkyODksImV4cCI6MjA5NjQ4NTI4OX0.kgYnKuk6IekYJY66sLyddFk2IddWzBeR5W5VccxbZgM";           // anon (publishable) key ONLY — never the service key
const CEILING = Number("1300000") || 1300000;
const TENURE_YEARS = 15;
const TOWNS = ["Wenham", "Hamilton"];
const ZIPS = { Wenham: "01984", Hamilton: "01982" };
const DEMO = new URLSearchParams(location.search).get("demo") === "1";
const PROP_FIELDS = "id,address,year_built,building_style,sqft,lot_size," +
  "assessed_value,price_estimate,last_sale_date,last_sale_price,on_market," +
  "bedrooms,bathrooms,road_fclass,road_aadt";

// ---- theme: manual override persists; absent = follow system ----
// (this runs during parse, before first paint — no wrong-theme flash)
{
  const t = localStorage.getItem("hh_theme");
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
}
const themeMQ = matchMedia("(prefers-color-scheme: dark)");
const currentTheme = () =>
  document.documentElement.dataset.theme || (themeMQ.matches ? "dark" : "light");
const SUN_ICON = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
  stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/>
  <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>`;
const MOON_ICON = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
  stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;

window.toggleTheme = () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("hh_theme", next);
  syncThemeBtn();
};

function syncThemeBtn() {
  const b = document.getElementById("themebtn");
  if (!b) return;
  const cur = currentTheme();   // icon shows the ACTIVE theme; label = action
  b.innerHTML = cur === "dark" ? MOON_ICON : SUN_ICON;
  b.setAttribute("aria-label",
    cur === "dark" ? "Switch to light theme" : "Switch to dark theme");
}
themeMQ.addEventListener("change", syncThemeBtn);   // system change, no override

const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plural = n => n === 1 ? "" : "s";

function anonKey() {
  if (!BAKED_KEY.startsWith("__")) return BAKED_KEY;
  return localStorage.getItem("hh_anon_key") || null;
}

async function api(path, params, opts = {}) {
  const qs = new URLSearchParams(params).toString();
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}${qs ? "?" + qs : ""}`, {
    method: opts.method || "GET",
    headers: Object.assign({
      apikey: anonKey(), Authorization: `Bearer ${anonKey()}`,
      "Content-Type": "application/json",
    }, opts.headers || {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return opts.raw ? r : r.json();
}

// ---- link construction (mirrors pipeline/watchlist_export.py links_md) ----
function displayAddr(addr) {
  const words = { AV: "Ave", WM: "William" };
  return addr.split(" ").map(w =>
    words[w] || w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(" ");
}
function links(addr, town) {
  const da = displayAddr(addr);
  const full = `${da}, ${town}, MA ${ZIPS[town]}`;
  const z = `https://www.zillow.com/homes/${encodeURIComponent(full.replace(/ /g, "-"))}_rb/`;
  const q = encodeURIComponent(full);
  return { z,
    r: `https://www.google.com/search?q=redfin+${q}`,
    m: `https://www.google.com/maps/place/${q}` };
}

// ---- who has evaluated what ----
// marks: DB truth from the eval_marks view (property_id + nominated_by only —
// verdicts/verbatim stay unreadable to the anon key). localVerdicts: this
// browser's memory of its own saves, used to enrich tags with the verdict.
const localVerdicts = JSON.parse(localStorage.getItem("hh_done") || "{}");
let marks = new Map();          // pid -> Set(names)
function addMark(pid, name) {
  if (!marks.has(pid)) marks.set(pid, new Set());
  marks.get(pid).add(name);
}
function recordSave(pid, verdict, name) {
  (localVerdicts[pid] = localVerdicts[pid] || []).push(
    { verdict, who: name, at: new Date().toISOString() });
  localStorage.setItem("hh_done", JSON.stringify(localVerdicts));
  addMark(pid, name);
}

let who = localStorage.getItem("hh_who") || "";

// ---- list view state ----
const view = { mode: "off", town: "All", road: "any", beds: null, sort: "est",
               dir: "asc", yrMin: null, yrMax: null, q: "", showDone: false };
const SORT_KEYS = {
  est:      p => p.price_estimate,
  assessed: p => p.assessed_value,
  year:     p => p.year_built,
  sqft:     p => p.sqft,
  lot:      p => Number(p.lot_size),
};

// ---- rendering ----
const HURDLES = [
  ["main_road", "Main road"], ["curb_appeal", "Curb appeal"],
  ["lot_size", "Lot size"], ["neighbors", "Neighbors"],
  ["yard", "Yard"], ["placement", "Placement"],
];
const VERDICTS = ["would-offer-now", "would-consider", "pass-on-house", "pass-on-location-only"];
const GATE_VERDICTS = ["would-consider", "defer", "exclude"];
const VERDICT_LABELS = {
  "would-offer-now": "Would offer now",
  "would-consider": "Would consider",
  "pass-on-house": "Pass on house",
  "pass-on-location-only": "Pass on location only",
  "defer": "Defer",
  "exclude": "Exclude",
};
const formState = {};   // pid -> {verdict, axes: [], hurdles: {}}
const AXES = ["house", "location", "price", "condition", "none"];

function markTags(pid) {
  const names = marks.get(pid);
  if (!names) return "";
  return [...names].map(n => {
    const loc = (localVerdicts[pid] || []).filter(d => d.who === n).pop();
    const v = loc ? ` ${VERDICT_LABELS[loc.verdict] || loc.verdict}` : "";
    return `<span class="tag done">✓ ${esc(n)}${esc(v)}</span>`;
  }).join(" ");
}

const styleCase = s => String(s || "?").toLowerCase()
  .replace(/(^|\s)\S/g, c => c.toUpperCase());

function homeCard(p, town, inCut, mode, listPrice) {
  const tier = p.assessed_value <= inCut ? "in" : "watch";
  const saleYr = (p.last_sale_date || "").slice(0, 4);
  const tenure = saleYr ? `${new Date().getFullYear() - +saleYr}y` : "?";
  const lot = p.lot_size ? (p.lot_size / 43560).toFixed(2) + " ac" : "?";
  const road = p.road_fclass != null && p.road_fclass <= 6
    ? `<span class="tag road">MAIN RD${p.road_aadt ? ` · ${Math.round(p.road_aadt / 1000)}k/day` : ""}</span>` : "";
  const bb = p.bedrooms ? ` · ${p.bedrooms}bd/${Number(p.bathrooms) || "?"}ba` : "";
  const l = links(p.address, town);
  const sold = p.last_sale_price > 1000
    ? ` · sold ${saleYr} for $${p.last_sale_price.toLocaleString()}` : "";
  const priceRow = mode === "on"
    ? `<span class="amt">${listPrice ? "$" + listPrice.toLocaleString() : "price TBD"}</span> list`
    : `<span class="amt">$${p.price_estimate.toLocaleString()}</span> est
       <span class="tag ${tier}">${tier}</span>`;
  const fine = mode === "on"
    ? `Est $${(p.price_estimate || 0).toLocaleString()} ·
       assessed $${p.assessed_value.toLocaleString()}${sold}`
    : `Assessed $${p.assessed_value.toLocaleString()}${sold}`;
  return `<div class="card" data-addr="${esc(p.address.toLowerCase())}" data-pid="${p.id}">
    <div class="addr">${esc(p.address)} ${road} ${markTags(p.id)}</div>
    <div class="qual">${esc(styleCase(p.building_style))}${bb}</div>
    <div class="pricerow">${priceRow}</div>
    <dl class="stats">
      <div><dt>Sqft</dt><dd>${(p.sqft || 0).toLocaleString()}</dd></div>
      <div><dt>Lot</dt><dd>${lot}</dd></div>
      <div><dt>Built</dt><dd>${p.year_built || "?"}</dd></div>
      <div><dt>Tenure</dt><dd>${tenure}</dd></div>
    </dl>
    <div class="fine">${fine}</div>
    <div class="row2">
      <span class="links"><a href="${l.z}" target="_blank" rel="noopener">Zillow</a>
        <a href="${l.r}" target="_blank" rel="noopener">Redfin</a>
        <a href="${l.m}" target="_blank" rel="noopener">Map</a></span>
      <button class="evalbtn" onclick="toggleForm(${p.id}, this, '${mode}')">Evaluate</button>
    </div>
    <div class="formslot"></div>
  </div>`;
}

window.toggleForm = (pid, btn, mode) => {
  const slot = btn.closest(".card").querySelector(".formslot");
  if (slot.innerHTML) { slot.innerHTML = ""; return; }
  const p = findHome(pid);
  const hurdles = {};
  if (mode === "off" && p && p.road_fclass != null)
    hurdles.main_road = p.road_fclass <= 6 ? "fail" : "pass";
  formState[pid] = { verdict: null, axes: [], hurdles };
  slot.innerHTML = mode === "off" ? gateForm(pid, hurdles) : listingForm(pid);
  if (mode !== "off" && !("ontouchstart" in window))
    slot.querySelector("textarea").focus();
};

function gateForm(pid, hurdles) {
  return `<form onsubmit="return saveEval(event, ${pid}, 'off')" onkeydown="formEsc(event)">
    <div class="grp"><span class="lbl" id="hlbl-${pid}">Hurdles</span>
      <span class="hint">Tap once ✓ cleared, again ✗ failed. Main road is pre-filled from MassDOT data.</span>
      <div class="opts" role="group" aria-labelledby="hlbl-${pid}">
      ${HURDLES.map(([k, label]) => {
        const st = hurdles[k] || "";
        const cls = st === "pass" ? "on" : st === "fail" ? "fail" : "";
        const glyph = st === "pass" ? "✓" : st === "fail" ? "✗" : "";
        return `<button type="button" class="${cls}" data-h="${k}"
          onclick="cycleHurdle(${pid}, '${k}', this)">${label}<span class="glyph">${glyph}</span></button>`;
      }).join("")}
    </div></div>
    <div class="grp"><span class="lbl" id="jlbl-${pid}">Judgment</span>
      <div class="opts" role="group" aria-labelledby="jlbl-${pid}">
      ${GATE_VERDICTS.map(v => `<button type="button" onclick="pickVerdict(${pid}, '${v}', this)">${VERDICT_LABELS[v]}</button>`).join("")}
    </div></div>
    <div class="grp"><label class="lbl" for="vr-${pid}">Note — optional</label>
      <textarea id="vr-${pid}" onkeydown="textareaSubmit(event)"
        placeholder="Anything worth remembering from Street View"></textarea></div>
    <button class="save" type="submit">Save as ${esc(who)}</button>
    <div class="err" role="alert"></div>
  </form>`;
}

function listingForm(pid) {
  return `<form onsubmit="return saveEval(event, ${pid}, 'on')" onkeydown="formEsc(event)">
    <div class="grp"><span class="lbl" id="vlbl-${pid}">Verdict</span>
      <div class="opts" role="group" aria-labelledby="vlbl-${pid}">
      ${VERDICTS.map(v => `<button type="button" onclick="pickVerdict(${pid}, '${v}', this)">${VERDICT_LABELS[v]}</button>`).join("")}
    </div></div>
    <div class="grp"><span class="lbl" id="albl-${pid}">Failure axes — tap in order, primary first</span>
      <div class="opts" role="group" aria-labelledby="albl-${pid}">
      ${AXES.map(a => `<button type="button" data-axis="${a}" onclick="pickAxis(${pid}, '${a}', this)">${a.charAt(0).toUpperCase() + a.slice(1)}</button>`).join("")}
    </div></div>
    <div class="grp"><label class="lbl" for="vr-${pid}">Reasoning — your actual words</label>
      <textarea id="vr-${pid}" required onkeydown="textareaSubmit(event)"
        placeholder="Why? Verbatim — this is the asset."></textarea></div>
    <button class="save" type="submit">Save as ${esc(who)}</button>
    <div class="err" role="alert"></div>
  </form>`;
}

window.cycleHurdle = (pid, k, btn) => {
  const h = formState[pid].hurdles;
  const next = { undefined: "pass", pass: "fail", fail: undefined }[h[k]];
  if (next) h[k] = next; else delete h[k];
  btn.className = next === "pass" ? "on" : next === "fail" ? "fail" : "";
  btn.querySelector(".glyph").textContent =
    next === "pass" ? "✓" : next === "fail" ? "✗" : "";
};

window.formEsc = e => {
  if (e.key === "Escape") e.target.closest(".formslot").innerHTML = "";
};

window.textareaSubmit = e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter")
    e.target.closest("form").requestSubmit();
};

window.pickVerdict = (pid, v, btn) => {
  formState[pid].verdict = v;
  for (const b of btn.parentNode.children) b.classList.toggle("on", b === btn);
};

window.pickAxis = (pid, a, btn) => {
  const axes = formState[pid].axes;
  const i = axes.indexOf(a);
  i >= 0 ? axes.splice(i, 1) : axes.push(a);
  for (const b of btn.parentNode.children) {
    const j = axes.indexOf(b.dataset.axis);
    b.classList.toggle("on", j >= 0);
    b.querySelector(".ord")?.remove();
    if (j >= 0 && axes.length > 1)
      b.insertAdjacentHTML("beforeend", `<span class="ord">${j + 1}</span>`);
  }
};

window.saveEval = (ev, pid, mode) => {
  ev.preventDefault();
  const form = ev.target, st = formState[pid];
  const err = form.querySelector(".err");
  const save = form.querySelector(".save");
  const text = form.querySelector("textarea").value.trim();
  if (!st.verdict) { err.textContent = "Pick a " + (mode === "off" ? "judgment" : "verdict") + " first."; return false; }
  if (mode !== "off" && !text) { err.textContent = "Reasoning is required — it's the asset."; return false; }
  if (DEMO) { err.textContent = "Demo mode — nothing is saved."; return false; }
  save.disabled = true;
  save.textContent = "Saving…";
  api("evaluations", {}, {
    method: "POST", raw: true,
    headers: { Prefer: "return=minimal" },
    body: { property_id: pid, verdict: st.verdict,
            failure_axis: st.axes.length ? st.axes : null,
            hurdles: Object.keys(st.hurdles).length ? st.hurdles : null,
            nominated_by: who, verbatim_reasoning: text || null },
  }).then(() => {
    recordSave(pid, st.verdict, who);
    renderList();
  }).catch(e => {
    err.textContent = "Save failed: " + String(e.message).slice(0, 200);
    save.disabled = false;
    save.textContent = `Save as ${who}`;
  });
  return false;
};

window.setWho = w => {
  who = w;
  localStorage.setItem("hh_who", w);
  if (!data) { main(); return; }           // arriving from the profile gate
  const chip = document.getElementById("whochip");
  if (!chip) { renderShell(); return; }
  chip.innerHTML = `<span class="ava" aria-hidden="true">${esc(who[0])}</span><span class="name">${esc(who)}</span>`;
  chip.setAttribute("aria-label", `Evaluating as ${who} — switch person`);
  renderList();   // open forms reset; Save labels and queues follow `who`
};

// ---- profile action sheet: switching identity is a deliberate act ----
window.openWhoSheet = () => {
  if (document.getElementById("whosheet")) return;
  const el = document.createElement("div");
  el.id = "whosheet";
  el.innerHTML = `<div class="sheet-backdrop" onclick="closeWhoSheet()"></div>
    <div class="sheet" role="menu" aria-label="Switch who's evaluating">
      <p class="note" style="margin:6px 12px 8px">Who's evaluating? Queues and
        saved verdicts follow the name.</p>
      ${["Luke", "Michelle"].map(w =>
        `<button class="item" role="menuitemradio" aria-checked="${w === who}"
           onclick="chooseWho('${w}')">
           <span class="ava" aria-hidden="true">${w[0]}</span>${w}
           ${w === who ? '<span class="check">✓</span>' : ""}
         </button>`).join("")}
      <button class="item cancel" role="menuitem" onclick="closeWhoSheet()">Cancel</button>
    </div>`;
  document.body.appendChild(el);
  document.getElementById("whochip").setAttribute("aria-expanded", "true");
  document.addEventListener("keydown", whoSheetKey);

};

window.closeWhoSheet = () => {
  document.getElementById("whosheet")?.remove();
  document.removeEventListener("keydown", whoSheetKey);
  const chip = document.getElementById("whochip");
  if (chip) { chip.setAttribute("aria-expanded", "false"); chip.focus(); }
};

window.chooseWho = w => {
  closeWhoSheet();
  if (w !== who) setWho(w);
};

function whoSheetKey(e) {
  if (e.key === "Escape") closeWhoSheet();
}

window.setMode = m => {
  view.mode = m;
  for (const b of document.querySelectorAll("#modeseg button"))
    b.classList.toggle("on", b.dataset.mode === m);
  renderList();
};

window.setTown = t => { view.town = t; renderList(); };
window.setRoad = r => { view.road = r; renderList(); };
window.setBeds = b => { view.beds = b === "any" ? null : +b; renderList(); };
window.setSort = s => { view.sort = s; renderList(); };
window.flipDir = btn => {
  view.dir = view.dir === "asc" ? "desc" : "asc";
  btn.textContent = view.dir === "asc" ? "↑" : "↓";
  renderList();
};
window.toggleDone = () => { view.showDone = !view.showDone; renderList(); };

let yrTimer;
window.setYears = () => {
  clearTimeout(yrTimer);
  yrTimer = setTimeout(() => {
    const val = id => {
      const v = document.getElementById(id).value.trim();
      return /^\d{4}$/.test(v) ? +v : null;   // apply only complete years
    };
    view.yrMin = val("yrmin");
    view.yrMax = val("yrmax");
    renderList();
  }, 300);
};

window.filterCards = q => { view.q = q.trim().toLowerCase(); applyAddrFilter(); };

function applyAddrFilter() {
  let shown = 0;
  for (const c of document.querySelectorAll(".card")) {
    const hit = !view.q || c.dataset.addr.includes(view.q);
    c.style.display = hit ? "" : "none";
    if (hit) shown++;
  }
  const none = document.getElementById("nomatch");
  if (none) none.hidden = shown > 0 || !document.querySelector(".card");
}

function passesFilters(p) {
  if (view.yrMin !== null || view.yrMax !== null) {
    if (!p.year_built) return false;
    if (view.yrMin !== null && p.year_built < view.yrMin) return false;
    if (view.yrMax !== null && p.year_built > view.yrMax) return false;
  }
  if (view.road === "res" && !(p.road_fclass === 7)) return false;
  if (view.road === "main" && !(p.road_fclass != null && p.road_fclass <= 6)) return false;
  if (view.beds !== null && !(p.bedrooms >= view.beds)) return false;
  return true;
}

function sortHomes(rows) {
  const key = SORT_KEYS[view.sort];
  const sgn = view.dir === "asc" ? 1 : -1;
  return [...rows].sort((a, b) => {
    const ka = key(a), kb = key(b);
    if (ka == null && kb == null) return 0;
    if (ka == null) return 1;                 // nulls last either direction
    if (kb == null) return -1;
    return (ka - kb) * sgn;
  });
}

let data = null;   // { watch, onmarket, listPrice }

function findHome(pid) {
  for (const town of TOWNS)
    for (const src of [data.watch, data.onmarket]) {
      const hit = (src[town]?.homes || []).find(p => p.id === pid);
      if (hit) return hit;
    }
  return null;
}

function counts() {
  const c = { off: 0, on: 0 };
  for (const town of TOWNS) {
    c.off += (data.watch[town]?.homes || []).length;
    c.on += (data.onmarket[town]?.homes || []).length;
  }
  return c;
}

function renderShell() {
  const c = counts();
  $app.innerHTML = `<header>
    <div class="hdr-row primary">
      <span class="seg" id="modeseg" role="group" aria-label="View">
        <button data-mode="off" class="${view.mode === "off" ? "on" : ""}"
          onclick="setMode('off')">Off-market (${c.off})</button>
        <button data-mode="on" class="${view.mode === "on" ? "on" : ""}"
          onclick="setMode('on')">On market (${c.on})</button>
      </span>
      <span class="hdr-right">
        <button class="iconbtn" id="themebtn" onclick="toggleTheme()"></button>
        <button class="who-chip" id="whochip" aria-haspopup="menu"
          aria-expanded="false" aria-label="Evaluating as ${esc(who)} — switch person"

      <span class="selwrap"><select class="ctl" aria-label="Town"

      </select></span>

          <span class="selwrap"><select class="ctl" id="sortsel"

            ${[["est", "Price est."], ["assessed", "Assessed"],

               ${view.sort === v ? "selected" : ""}>${l}</option>`).join("")}
          </select></span>

            title="Reverse sort order" onclick="flipDir(this)">↑</button>
        </span>
      </span>
      <span class="ctl-lbl yr"><label for="yrmin">Built</label>
        <input class="ctl" id="yrmin" inputmode="numeric" maxlength="4"
          placeholder="min" aria-label="Built after year" oninput="setYears()">
        –
        <input class="ctl" id="yrmax" inputmode="numeric" maxlength="4"
          placeholder="max" aria-label="Built before year" oninput="setYears()">
      </span>
      <input type="search" placeholder="Street…" aria-label="Filter by street name"
        autocomplete="off" spellcheck="false" oninput="filterCards(this.value)">
    </div></header><main id="list"></main>`;
  syncThemeBtn();
  renderList();
}

function renderList() {
  if (!data) return;
  const src = view.mode === "off" ? data.watch : data.onmarket;
  let total = 0, doneTotal = 0;
  let html = "";
  if (DEMO) html += `<p class="note">Demo data — saving is disabled.</p>`;
  if (view.mode === "on")
    html += `<p class="note">Watchlist homes that are on the market right now —
      preparation meets opportunity. Photos exist here, so the full verdict +
      your words applies. List price from the most recent Redfin alert.</p>`;
  let doneHtml = "";
  for (const town of TOWNS) {
    if (view.town !== "All" && view.town !== town) continue;
    const { r, homes } = src[town] || { homes: [] };
    const inCut = r ? CEILING / Number(r.r_p75) : Infinity;
    const rows = sortHomes((homes || []).filter(passesFilters));
    const queue = rows.filter(p => !(marks.get(p.id)?.has(who)));
    const mine = rows.filter(p => marks.get(p.id)?.has(who));
    total += queue.length;
    doneTotal += mine.length;
    const rctx = r ? ` <span class="prov">R ${r.r_median} · n=${r.n} · ${r.computed_at.slice(0, 10)}</span>` : "";
    html += `<h2>${town} — ${queue.length} to review${view.mode === "off" ? rctx : ""}</h2>`;
    if (view.mode === "on" && !(homes || []).length)
      html += `<p class="note">No watchlist homes listed in ${town} right now —
        when one lists, it appears here (and leaves the off-market queue).</p>`;
    html += queue.map(p => homeCard(p, town, inCut, view.mode,
      data.listPrice[p.id])).join("");
    if (mine.length && view.showDone)
      doneHtml += `<h2>${town} — done by ${esc(who)} (${mine.length})</h2>` +
        mine.map(p => homeCard(p, town, inCut, view.mode,
          data.listPrice[p.id])).join("");
  }
  if (total === 0) html += `<p class="note">Queue clear — no homes match these filters that ${esc(who)} hasn't evaluated.</p>`;
  if (doneTotal)
    html += `<button class="donetoggle" onclick="toggleDone()">
      ${view.showDone ? "▾ Hide" : "▸ Show"} ${doneTotal} already evaluated by ${esc(who)}</button>`;
  html += doneHtml;
  html += `<p class="note" id="nomatch" hidden>No homes match this filter.</p>`;
  html += `<p class="note">Queues are per person — homes you evaluate leave your
    queue and stay in the other. Ceiling $${CEILING.toLocaleString()} ·
    est = assessed × R · MAIN RD per MassDOT (peak daily traffic).</p>`;
  document.getElementById("list").innerHTML = html;
  applyAddrFilter();
}

function renderGate() {
  $app.innerHTML = `<div class="gate"><h1>Who's evaluating?</h1>
    ${["Luke", "Michelle"].map(w =>
      `<button onclick="setWho('${w}')">${w}</button>`).join("")}

function renderSetup() {
  $app.innerHTML = `<div class="setup"><h1>Setup</h1>

async function main() {
  if (!DEMO && !anonKey()) { renderSetup(); return; }
  if (!who) { renderGate(); return; }
  $app.innerHTML = `<p class="note" style="margin:40px 16px">Loading…</p>`;
  try {
    data = DEMO ? demoData() : await loadAll();
    renderShell();
  } catch (e) {
    $app.innerHTML = `<div class="setup"><p class="err">Load failed: ${esc(e.message)}</p>
      <button class="save" onclick="localStorage.removeItem('hh_anon_key');
        location.reload()">Re-enter key</button></div>`;
  }
}

async function loadAll() {
  const cutoff = new Date(Date.now() - TENURE_YEARS * 365.25 * 864e5)
    .toISOString().slice(0, 10);
  const [soldRows, rRows, markRows] = await Promise.all([
    api("listing_events", { event: "eq.sold", select: "property_id" }),
    api("town_price_ratios", { town: `in.(${TOWNS.join(",")})`,
      select: "town,r_median,r_p75,n,computed_at", order: "computed_at.desc" }),
    api("eval_marks", { select: "property_id,nominated_by" }),
  ]);
  marks = new Map();
  for (const m of markRows) addMark(m.property_id, m.nominated_by);
  const sold = new Set(soldRows.map(r => r.property_id));
  const R = {};
  for (const r of rRows) if (!R[r.town]) R[r.town] = r;
  // ONE universe — the watchlist — partitioned by listing state. A home
  // lives in the off-market gate queue until it lists, then moves to the
  // on-market view (photos exist -> full evaluation). Non-criteria listings
  // never enter either view: the shortlist exists to not waste time on them.
  const watch = {}, onmarket = {};
  for (const town of TOWNS) {
    const wl = await api("properties", {
      town: `eq.${town}`, building_style: "ilike.*COLONIAL*",
      sqft: "gte.1800", last_sale_price: "gt.100000",
      last_sale_date: `lt.${cutoff}`, price_estimate: `lte.${CEILING}`,
      select: PROP_FIELDS, order: "price_estimate.asc" });
    const rows = wl.filter(p => !sold.has(p.id));
    watch[town] = { r: R[town], homes: rows.filter(p => p.on_market !== true) };
    onmarket[town] = { r: R[town], homes: rows.filter(p => p.on_market === true) };
  }
  const onmIds = TOWNS.flatMap(t => onmarket[t].homes.map(p => p.id));
  const listPrice = {};
  if (onmIds.length) {
    const ev = await api("listing_events", {
      property_id: `in.(${onmIds.join(",")})`,
      event: "in.(listed,price_change)",
      select: "property_id,list_price,observed_on", order: "observed_on.desc" });
    for (const e of ev)
      if (e.list_price && !(e.property_id in listPrice))
        listPrice[e.property_id] = e.list_price;
  }
  return { watch, onmarket, listPrice };
}

}
